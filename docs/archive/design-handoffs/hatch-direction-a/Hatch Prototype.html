<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hatch — Direction A Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #08080b; }
  * { -webkit-font-smoothing: antialiased; box-sizing: border-box; }
  #root { height: 100%; }
  .stage { height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 800px at 50% -10%, #15151c 0%, #08080b 60%); }
  @keyframes tRise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes ovRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  /* hide scrollbars inside the phone (touch-scroll prototype) */
  *::-webkit-scrollbar { width: 0; height: 0; display: none; }
  * { scrollbar-width: none; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="hatch-ui.jsx"></script>
<script type="text/babel" src="proto-app.jsx"></script>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#0b0b0f"/>
    <rect x="34" y="20" width="32" height="60" rx="7" fill="none" stroke="#5b9bff" stroke-width="2.5"/>
    <circle cx="44" cy="40" r="3" fill="#5b9bff"/><circle cx="50" cy="40" r="3" fill="#b794ff"/>
    <circle cx="56" cy="40" r="3" fill="#3ddc97"/>
    <rect x="42" y="52" width="16" height="3" rx="1.5" fill="#3ddc97"/>
  </svg>
</template>

<script type="text/babel">
const { useMemo } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#36c5a8",
  "voice": true,
  "dense": false
}/*EDITMODE-END*/;

function Root() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  // Re-tint the shared HT token object whenever the accent tweak changes.
  useMemo(() => applyAccent(t.accent), [t.accent]);

  return (
    <>
      <div className="stage">
        <IOSDevice dark>
          <PhoneApp t={t} />
        </IOSDevice>
      </div>

      <TweaksPanel>
        <TweakSection label="Voice & feel" />
        <TweakToggle label="Agent speaks in first person" value={t.voice} onChange={(v) => setTweak('voice', v)} />
        <TweakToggle label="Compact cards" value={t.dense} onChange={(v) => setTweak('dense', v)} />
        <TweakSection label="Accent" />
        <TweakColor label="Primary accent" value={t.accent}
          options={['#5b9bff', '#7c83ff', '#ff8f6b', '#36c5a8']}
          onChange={(v) => setTweak('accent', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
