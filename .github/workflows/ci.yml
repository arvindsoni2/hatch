name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate documentation
        run: |
          python scripts/check_readme_contract.py
          python scripts/check_docs.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run Ruff
        run: cd backend && ruff check app/ tests/
      - name: Run bounded Coach contract smoke
        run: |
          cd backend
          timeout 180s python -m benchmarks.coach smoke \
            --suite benchmarks/coach/fixtures/v1
      - name: Run backend tests
        run: cd backend && pytest --cov=app --cov-report=xml -q
      - name: Dead-code gates (import graph + vulture)
        run: |
          pip install vulture
          python scripts/dead_code_check.py
          vulture backend/app --min-confidence 90
      - name: Audit Python dependencies
        # Non-blocking until the current tree is fully clean; remove || true to enforce
        run: |
          pip install pip-audit
          for req in \
            backend/requirements.txt \
            backend/requirements-core.txt \
            backend/requirements-browser.txt \
            backend/requirements-local-ai.txt \
            backend/requirements-perception.txt \
            backend/requirements-full.txt; do
            echo "Auditing $req"
            pip-audit -r "$req" || true
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run frontend tests
        run: cd frontend && npx vitest run
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Type-check frontend
        run: cd frontend && npm run type-check
      - name: Dead export report (knip)
        # Non-blocking until the current tree is fully clean; remove || true to enforce
        run: cd frontend && npx knip || true
      - name: Audit npm dependencies
        # Non-blocking until the current tree is fully clean; remove || true to enforce
        run: cd frontend && npm audit --audit-level=high || true

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run mocked Windows installer tests
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/tests/test_windows_installer.ps1
      - name: Validate Windows PowerShell 5.1 compatibility
        shell: powershell
        run: |
          $env:HATCH_INSTALL_TEST_MODE = "1"
          . .\install.ps1
          if ((Resolve-HatchInstallMode "ai-later") -ne "AiLater") { exit 1 }
          if ((Resolve-HatchBackendProfile "local-embeddings") -ne "local-embeddings") { exit 1 }
      - name: Validate bootstrapper launch path without installing
        shell: pwsh
        run: |
          $env:HATCH_INSTALL_TEST_MODE = "1"
          cmd /c install-hatch.cmd -CheckOnly -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate invalid argument exit code
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "pwsh" -ArgumentList @(
            "-NoLogo", "-NoProfile", "-File", ".\install.ps1",
            "-Mode", "invalid", "-NonInteractive", "-Json"
          ) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 8) { exit 1 }
