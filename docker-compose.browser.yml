services:
  backend:
    image: hatch-backend:browser
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: browser
    environment:
      HATCH_BACKEND_PROFILE: browser
      HATCH_BROWSER_AUTOMATION_ENABLED: "1"
      HATCH_LOCAL_EMBEDDINGS_ENABLED: "0"
      HATCH_PERCEPTION_ENABLED: "0"
      HATCH_ADVANCED_COACH_ENABLED: "0"
      PLAYWRIGHT_HEADLESS: "true"
      HATCH_BROWSER_ENABLED: "true"
