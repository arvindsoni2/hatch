# JobPilot v2 — Docker Compose
# Local self-hosted deployment — all data stays on your machine.
# Auto-starts on reboot via the jobpilot.service systemd unit.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobpilot-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/jobpilot.db
      - LANGGRAPH_CHECKPOINT_DB=sqlite+aiosqlite:///./data/langgraph_checkpoints.db
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - PLAYWRIGHT_HEADLESS=true
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SCRAPE_INTERVAL_HOURS=${SCRAPE_INTERVAL_HOURS:-4}
      - SCORE_THRESHOLD=${SCORE_THRESHOLD:-0.75}
      - MAX_TAILOR_BATCH=${MAX_TAILOR_BATCH:-5}
      - AUTO_APPROVE=false
      # Whisper model cache — persists downloaded models across --build rebuilds
      # (data/ is already bind-mounted at /app/data, so no extra volume needed)
      - WHISPER_MODEL_CACHE=/app/data/models
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Bind-mount data/ so profile.yaml and the SQLite DB are editable on the host
      # :z adds SELinux shared label (required on Fedora/RHEL with SELinux enforcing)
      - ./data:/app/data:z
      # Bind-mount locales/ so new locale packs are picked up without rebuild
      - ./locales:/app/locales:ro,z
    # Allow the backend container to reach Ollama running on the host.
    # On Linux, host.docker.internal is not automatic — host-gateway maps it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - jobpilot

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - API_URL=http://backend:8000
    container_name: jobpilot-frontend
    environment:
      - API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - jobpilot

  # llamacpp service removed — Ollama (host) is used instead.
  # The GHCR llama.cpp images available are 2024 builds that predate Qwen3 support.
  # Model file is kept in ./models/Qwen3-14B-Q4_K_M.gguf for future use.
  # To re-enable: pull a 2025+ llama.cpp image that supports qwen3 architecture,
  # restore this block, and set profile.yaml llm.provider = llamacpp.

networks:
  jobpilot:
    driver: bridge
