# Hatch - local Docker Compose stack
# Local self-hosted deployment — all data stays on your machine.
# Optional auto-start is provided by infrastructure/systemd/hatch.service.

services:
  # ── llama-server: primary model (Qwen3-8B Q5_K_M, :8080) ───────────────────
  # Use ghcr.io/ggml-org/llama.cpp:server (rolling latest) or pin a bNNNN tag.
  # Model file: run scripts/fetch_models.sh to download Qwen3-8B-Q5_K_M.gguf
  llm-primary:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: hatch-llm-primary
    command: >
      --model /models/Qwen3-8B-Q5_K_M.gguf
      --ctx-size 16384
      --parallel 1
      --host 0.0.0.0
      --port 8080
    volumes:
      - ./data/models:/models:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - hatch

  # ── llama-server: triage model (Qwen3-0.6B Q8_0, :8081) ────────────────────
  # --parallel 2 gives 2048 tokens/slot (4096 / 2) — sufficient for TRIAGE (1536+256).
  llm-triage:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: hatch-llm-triage
    command: >
      --model /models/Qwen3-0.6B-Q8_0.gguf
      --ctx-size 4096
      --parallel 2
      --host 0.0.0.0
      --port 8081
    volumes:
      - ./data/models:/models:ro
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - hatch

  backend:
    image: hatch-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hatch-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/jobpilot.db
      - LANGGRAPH_CHECKPOINT_DB=sqlite+aiosqlite:///./data/langgraph_checkpoints.db
      - LANGGRAPH_STRICT_MSGPACK=true
      - PLAYWRIGHT_HEADLESS=true
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SCRAPE_INTERVAL_HOURS=${SCRAPE_INTERVAL_HOURS:-4}
      - SCORE_THRESHOLD=${SCORE_THRESHOLD:-0.75}
      - MAX_TAILOR_BATCH=${MAX_TAILOR_BATCH:-5}
      - AUTO_APPROVE=false
      # Whisper model cache — persists downloaded models across --build rebuilds
      # (data/ is already bind-mounted at /app/data, so no extra volume needed)
      - WHISPER_MODEL_CACHE=/app/data/models
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Bind-mount data/ so profile.yaml and the SQLite DB are editable on the host
      # :z adds SELinux shared label (required on Fedora/RHEL with SELinux enforcing)
      - ./data:/app/data:z
      # Bind-mount locales/ so new locale packs are picked up without rebuild
      - ./locales:/app/locales:ro,z
    depends_on:
      llm-primary:
        condition: service_started
      llm-triage:
        condition: service_started
    # On Linux, host.docker.internal is not automatic — host-gateway maps it.
    # Useful if using a cloud provider that proxies through the host network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - hatch

  frontend:
    image: hatch-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - API_URL=http://backend:8000
    container_name: hatch-frontend
    environment:
      - API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - hatch

networks:
  hatch:
    driver: bridge
