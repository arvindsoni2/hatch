# ── Hatch Example Profile — Local AI, $0/month ────────────────────────────────
# Uses bundled llama.cpp containers — no API keys, no cloud spend.
# Before starting Hatch, download the model files once:
#
#   bash scripts/fetch_models.sh
#   docker compose up -d
#
# Copy to data/profile.yaml and fill in your own details.

locale: "uk"

candidate:
  name: "Your Name"
  title: "Your Job Title"
  years_experience: 5
  summary: >
    Brief professional summary — 2-3 sentences. Focus on your domain,
    key technologies, and what makes you distinctive in the job market.

search:
  target_roles:
    - "Your Primary Role"
    - "Related Role Title"
  locations:
    - city: "Your City"
      country: "UK"
      radius_miles: 30
      remote_preference: "hybrid"
    - city: "Remote"
      country: "UK"
      radius_miles: 0
      remote_preference: "remote"
  contract_type: "contract"  # or "permanent"

compensation:
  min_rate: 400
  max_rate: 600
  rate_type: "daily"     # or "hourly", "annual"
  currency: "GBP"
  legal_preferences:
    contract_status: "outside"  # UK/IE: outside | inside | any

skills:
  primary:
    - "Your primary skill"
    - "Another core skill"
  secondary:
    - "Supporting skill"
    - "Tool or framework"
  certifications:
    - "Any relevant certification"

domains:
  preferred:
    - "Your preferred industry"
  excluded:
    - "Industry you'd avoid"

proof_points:
  - id: "achievement_one"
    summary: "Brief description of a key achievement"
    context: "Company / project context"
    metrics: "Quantified result — %, £, time saved, users impacted"
    tags: ["relevant", "tag"]

master_cv_path: "./data/master_cv.json"

job_boards:
  - name: "reed"
    enabled: true
    scraper: "ReedScraper"
    search_params:
      keywords: ["your role title"]
      location: "Your City"
  - name: "cwjobs"
    enabled: true
    scraper: "CWJobsScraper"
    search_params:
      keywords: ["your role title"]
      location: "Your City"

scoring:
  weights:
    skill_match: 0.35
    experience_match: 0.30
    rate_match: 0.20
    location_match: 0.15
  shortlist_threshold: 0.70

llm:
  # Local AI — bundled llama.cpp containers, $0 API spend, no key required.
  # Models are downloaded by scripts/fetch_models.sh:
  #   Primary:  Qwen3-8B-Q5_K_M.gguf (~5.9 GB) on port 8080
  #   Triage:   Qwen3-0.6B-Q8_0.gguf (~639 MB) on port 8081
  provider: "llamacpp"
  triage_model: "qwen3-0.6b-q8_0"
  primary_model: "qwen3-8b-q5_k_m"
  api_key_env: ""
  base_url: "http://llm-primary:8080/v1"
  triage_base_url: "http://llm-triage:8081/v1"
  temperature: 0.3
  max_retries: 3
  track_costs: false
  monthly_budget: 0
  currency: "GBP"

preferences:
  scrape_interval_hours: 4
  max_tailor_batch: 5
  follow_up_days: [5, 10, 15]
  locale: "en-GB"
  archive_after_days: 30
