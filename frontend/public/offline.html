<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JobPilot — Offline</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: #f8fafc;
    color: #1e293b;
    text-align: center;
  }
  .box { max-width: 400px; padding: 2rem; }
  .icon { font-size: 3rem; margin-bottom: 1rem; }
  h1 { font-size: 1.5rem; margin: 0 0 1rem; font-weight: 600; }
  p { color: #64748b; line-height: 1.6; margin: 0 0 1.5rem; }
  button {
    padding: 12px 24px;
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }
  button:hover { background: #4338ca; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">📡</div>
  <h1>You're offline</h1>
  <p>JobPilot needs a connection to your backend. Check your network and try again.</p>
  <button onclick="location.reload()">Retry</button>
</div>
</body>
</html>
