services:
  backend:
    image: hatch-backend:local-ai
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: local-ai
    environment:
      HATCH_BACKEND_PROFILE: local-embeddings
      HATCH_BROWSER_AUTOMATION_ENABLED: "0"
      HATCH_LOCAL_EMBEDDINGS_ENABLED: "1"
      HATCH_PERCEPTION_ENABLED: "0"
      HATCH_ADVANCED_COACH_ENABLED: "0"
