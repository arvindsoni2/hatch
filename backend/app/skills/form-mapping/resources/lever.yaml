# Lever ATS field schema for form-mapping skill.

fields:
  - field_id: name
    label: "Full Name"
    source: profile_field
    path: candidate.full_name

  - field_id: email
    label: "Email"
    source: profile_field
    path: candidate.email

  - field_id: phone
    label: "Phone"
    source: profile_field
    path: candidate.phone

  - field_id: org
    label: "Current Company"
    source: profile_field
    path: candidate.current_employer

  - field_id: resume
    label: "Resume"
    source: document
    document_type: cv

  - field_id: cover_letter
    label: "Cover Letter (optional)"
    source: document
    document_type: cover_letter

  - field_id: linkedin
    label: "LinkedIn"
    source: profile_field
    path: candidate.linkedin_url

  - field_id: location
    label: "Location"
    source: profile_field
    path: search.locations[0].city
